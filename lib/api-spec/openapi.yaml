      required: [requestedAmount, requestedCategory, categoryLabel, liquidity, upcomingObligations, fixedBills, debtObligations, categoryActual, categoryBudget, plannedIncome, plannedIncomeEntries, safeToSpendNow, safetyReserveTarget, riskBandAvailable, postPurchaseCoreReserve, barbellSafetyViolation, inflationRateAnnual, inflationAdjustedCostOfWaiting, waitingMonths, marginOfSafety, marketDataStatus, marketDataFetchedAt]
      properties:
        requestedAmount:
          type: number
        requestedCategory:
          type: string
        categoryLabel:
          type: string
        liquidity:
          type: number
        upcomingObligations:
          type: number
        fixedBills:
          type: number
        debtObligations:
          type: number
        categoryActual:
          type: number
          description: Recorded spending in the category during the current month
        categoryBudget:
          type: number
          description: Current monthly budget baseline from expense records
        plannedIncome:
          type: number
        plannedIncomeEntries:
          type: array
          items:
            $ref: "#/components/schemas/PlannedIncome"
        safeToSpendNow:
          type: number
        earliestIncomeMonth:
          type: ["string", "null"]
        safetyReserveTarget:
          type: number
        riskBandAvailable:
          type: number
        postPurchaseCoreReserve:
          type: number
        barbellSafetyViolation:
          type: boolean
        inflationRateAnnual:
          type: ["number", "null"]
        inflationAdjustedCostOfWaiting:
          type: ["number", "null"]
        waitingMonths:
          type: number
        marginOfSafety:
          type: number
        marketDataStatus:
          type: string
          enum: [live, cache, unavailable]
        marketDataFetchedAt:
          type: ["string", "null"]

    PurchaseCheckResult:
      type: object
      required: [verdict, reasoning, barbellCheck, inflationAssessment, action, responseText, context, isFallback]
      properties:
        verdict:
          type: string
