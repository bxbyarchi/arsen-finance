        conservativePaybackMonths:
          type: ["number", "null"]
        marginOfSafety:
          type: number
        riskRating:
          type: string
          enum: [Low, Medium, High, Barbell Violation]
        riskCapitalLimit:
          type: number
        isBarbellViolation:
          type: boolean

    HypothesisEvaluationResult:
      type: object
      required: [hypothesis, evaluation]
      properties:
        hypothesis:
          $ref: "#/components/schemas/BusinessHypothesis"
        evaluation:
          $ref: "#/components/schemas/HypothesisEvaluation"

    # ─── Purchase advisor ─────────────────────────────────────
    PurchaseCheckInput:
