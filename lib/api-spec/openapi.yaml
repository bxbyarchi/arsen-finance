openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Smart Finance & Crisis Manager API
servers:
  - url: /api
    description: Base API path
tags:
  - name: Auth
    description: Browser authentication endpoints
  - name: health
    description: Health operations
  - name: debts
    description: Debt and loan management
  - name: expenses
    description: Essential and variable expenses
  - name: incomes
    description: Income and revenue projections
  - name: profile
    description: Financial profile and settings
  - name: dashboard
    description: Dashboard summary and analytics
  - name: crisis
    description: Crisis simulation and runway analysis
  - name: ai
    description: AI financial advisor
  - name: advisor
    description: Purchase safety advisor
  - name: projects
    description: Multi-project P&L accounting
  - name: davlatov
    description: Davlatov wealth allocation engine
  - name: goals
    description: Savings goals and milestones
  - name: behavioral
    description: Behavioral spending insights
  - name: resilience
    description: Financial autonomy and digital vault
  - name: hypotheses
    description: Business learning sandbox
  - name: telegram
    description: Telegram bot account linking and webhook delivery

paths:
  /auth/user:
    get:
      tags: [Auth]
      operationId: getCurrentAuthUser
      summary: Get the signed-in user
      responses:
        "200":
          description: Authentication status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUserEnvelope"
  /login:
    get:
      tags: [Auth]
      operationId: beginBrowserLogin
      summary: Start the secure browser sign-in flow
      parameters:
        - name: returnTo
          in: query
          required: false
          schema:
            type: string
      responses:
        "302":
          description: Redirect to the identity provider
  /callback:
    get:
      tags: [Auth]
      operationId: handleBrowserLoginCallback
      summary: Complete the secure browser sign-in flow
      responses:
        "302":
          description: Redirect to the app after authentication
  /logout:
    get:
      tags: [Auth]
      operationId: logoutBrowserSession
      summary: End the current browser session
      parameters:
        - name: returnTo
          in: query
          required: false
          schema:
            type: string
      responses:
        "302":
          description: Redirect after logout
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ─── Telegram ─────────────────────────────────────────────────
  /telegram/link-status:
    get:
      operationId: getTelegramLinkStatus
      tags: [telegram]
      summary: Get the signed-in user's Telegram connection status
      responses:
        "200":
          description: Private Telegram connection status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelegramLinkStatus"
        "401":
          description: Authentication required

  /telegram/link-token:
    post:
      operationId: createTelegramLinkToken
      tags: [telegram]
      summary: Create a short-lived one-time Telegram linking command
      responses:
        "201":
          description: Link command and deep link for the signed-in user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelegramLinkToken"
        "401":
          description: Authentication required

  /telegram/link:
    delete:
      operationId: unlinkTelegramAccount
      tags: [telegram]
      summary: Disconnect the signed-in user's Telegram chat
      responses:
        "200":
          description: Telegram account disconnected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelegramLinkStatus"
        "401":
          description: Authentication required

  /telegram/set-webhook:
    get:
      operationId: forceTelegramWebhook
      tags: [telegram]
      summary: Register the configured public webhook URL with Telegram
      responses:
        "200":
          description: Direct response from the Telegram Bot API
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelegramApiResponse"
        "401":
          description: Authenticated session or Telegram setup secret required
        "502":
          description: Telegram API unavailable or invalid webhook URL
        "503":
          description: Telegram webhook secret material is unavailable

  /telegram/status:
    get:
      operationId: getTelegramWebhookStatus
      tags: [telegram]
      summary: Get Telegram webhook configuration
      responses:
        "200":
          description: Direct response from the Telegram Bot API
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelegramApiResponse"
        "401":
          description: Authenticated session or Telegram setup secret required
        "502":
          description: Telegram API unavailable

  /telegram/setup-webhook:
    post:
      operationId: setupTelegramWebhook
      tags: [telegram]
      summary: Register the Telegram webhook against the published HTTPS app
      responses:
        "200":
          description: Webhook registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelegramSetupResult"
        "401":
          description: Authenticated session or Telegram setup secret required
        "503":
          description: Bot token, published HTTPS URL, or Telegram API unavailable

  /telegram/webhook:
    post:
      operationId: receiveTelegramWebhook
      tags: [telegram]
      summary: Receive a Telegram update and send a reply
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TelegramUpdateInput"
      responses:
        "200":
          description: Update accepted and handled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelegramWebhookResult"
        "401":
          description: Invalid Telegram secret header
        "502":
          description: Telegram reply could not be sent

  # ─── Debts ───────────────────────────────────────────────────
  /debts:
    get:
      operationId: listDebts
      tags: [debts]
      summary: List all debts
      responses:
        "200":
          description: List of debts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Debt"
    post:
      operationId: createDebt
      tags: [debts]
      summary: Create a new debt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DebtInput"
      responses:
        "201":
          description: Created debt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Debt"

  /debts/{id}:
    get:
      operationId: getDebt
      tags: [debts]
      summary: Get a debt by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Debt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Debt"
        "404":
          description: Not found
    put:
      operationId: updateDebt
      tags: [debts]
      summary: Update a debt
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DebtInput"
      responses:
        "200":
          description: Updated debt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Debt"
    delete:
      operationId: deleteDebt
      tags: [debts]
      summary: Delete a debt
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Deleted

  /debts/payoff-schedules:
    get:
      operationId: getPayoffSchedules
      tags: [debts]
      summary: Get debt payoff schedules using Snowball and Avalanche strategies
      responses:
        "200":
          description: Payoff schedule comparison
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayoffSchedules"

  # ─── Expenses ────────────────────────────────────────────────
  /expenses:
    get:
      operationId: listExpenses
      tags: [expenses]
      summary: List all expenses
      responses:
        "200":
          description: List of expenses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Expense"
    post:
      operationId: createExpense
      tags: [expenses]
      summary: Create a new expense
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpenseInput"
      responses:
        "201":
          description: Created expense
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Expense"

  /expenses/{id}:
    put:
      operationId: updateExpense
      tags: [expenses]
      summary: Update an expense
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpenseInput"
      responses:
        "200":
          description: Updated expense
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Expense"
    delete:
      operationId: deleteExpense
      tags: [expenses]
      summary: Delete an expense
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Deleted

  /expenses/burn-rate:
    get:
      operationId: getBurnRate
      tags: [expenses]
      summary: Get total monthly burn rate breakdown (essential vs variable)
      responses:
        "200":
          description: Burn rate summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BurnRate"

  # ─── Incomes ─────────────────────────────────────────────────
  /incomes:
    get:
      operationId: listIncomes
      tags: [incomes]
      summary: List all income entries
      responses:
        "200":
          description: List of incomes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Income"
    post:
      operationId: createIncome
      tags: [incomes]
      summary: Create a new income entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IncomeInput"
      responses:
        "201":
          description: Created income
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Income"

  /incomes/{id}:
    put:
      operationId: updateIncome
      tags: [incomes]
      summary: Update an income entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IncomeInput"
      responses:
        "200":
          description: Updated income
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Income"
    delete:
      operationId: deleteIncome
      tags: [incomes]
      summary: Delete an income entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Deleted

  /incomes/projection-summary:
    get:
      operationId: getProjectionSummary
      tags: [incomes]
      summary: Get actual vs projected income with confidence-weighted totals
      responses:
        "200":
          description: Projection summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectionSummary"

  # ─── Profile ─────────────────────────────────────────────────
  /profile:
    get:
      operationId: getProfile
      tags: [profile]
      summary: Get the financial profile
      responses:
        "200":
          description: Financial profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinancialProfile"
    patch:
      operationId: updateProfile
      tags: [profile]
      summary: Update the financial profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdate"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinancialProfile"

  # ─── Dashboard ───────────────────────────────────────────────
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get high-level financial dashboard summary
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  # ─── Crisis ──────────────────────────────────────────────────
  /crisis/simulation:
    get:
      operationId: getCrisisSimulation
      tags: [crisis]
      summary: Run crisis simulation - calculate financial runway and action plan
      responses:
        "200":
          description: Crisis simulation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CrisisSimulation"

  # ─── AI ──────────────────────────────────────────────────────
  /ai/analyze:
    post:
      operationId: analyzeFinances
      tags: [ai]
      summary: Get AI-powered financial analysis with optimizations and risk alerts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AIAnalysisRequest"
      responses:
        "200":
          description: AI financial analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AIAnalysisResult"

  # ─── Purchase advisor ────────────────────────────────────────
  /advisor/purchase-check:
    post:
      operationId: checkPurchaseSafety
      tags: [advisor]
      summary: Check whether a planned purchase is safe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PurchaseCheckInput"
      responses:
        "200":
          description: Purchase safety verdict and financial context
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchaseCheckResult"

  /advisor/chat:
    post:
      operationId: sendAdvisorChatMessage
      tags: [advisor]
      summary: Send a conversational message to the financial advisor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdvisorChatInput"
      responses:
        "200":
          description: Structured advisor chat response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdvisorChatResult"

  # ─── Projects ────────────────────────────────────────────────
  /projects/summary:
    get:
      operationId: getProjectsSummary
      tags: [projects]
      summary: Get aggregate P&L summary across all projects
      responses:
        "200":
          description: Projects summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectsSummary"

  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: List all projects
      responses:
        "200":
          description: List of projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
    post:
      operationId: createProject
      tags: [projects]
      summary: Create a new project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectInput"
      responses:
        "201":
          description: Created project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"

  /projects/{id}:
    get:
      operationId: getProject
      tags: [projects]
      summary: Get a project by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          description: Not found
    put:
      operationId: updateProject
      tags: [projects]
      summary: Update a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectInput"
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
    delete:
      operationId: deleteProject
      tags: [projects]
      summary: Delete a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Deleted

  /projects/{id}/entries:
    get:
      operationId: listProjectEntries
      tags: [projects]
      summary: List all monthly entries for a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: List of project entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProjectEntry"
    post:
      operationId: createProjectEntry
      tags: [projects]
      summary: Create a monthly P&L entry for a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectEntryInput"
      responses:
        "201":
          description: Created entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectEntry"

  /projects/{id}/entries/{entryId}:
    put:
      operationId: updateProjectEntry
      tags: [projects]
      summary: Update a project entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
        - name: entryId
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectEntryInput"
      responses:
        "200":
          description: Updated entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectEntry"
    delete:
      operationId: deleteProjectEntry
      tags: [projects]
      summary: Delete a project entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
        - name: entryId
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Deleted

  # ─── Davlatov ────────────────────────────────────────────────
  /davlatov/allocate:
    post:
      operationId: createDavlatovAllocation
      tags: [davlatov]
      summary: Calculate and save Davlatov wealth allocation for an amount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DavlatovAllocateRequest"
      responses:
        "201":
          description: Allocation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DavlatovAllocation"

  /davlatov/allocations:
    get:
      operationId: listDavlatovAllocations
      tags: [davlatov]
      summary: List all saved Davlatov allocations
      responses:
        "200":
          description: List of allocations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DavlatovAllocation"

  /davlatov/allocations/{id}:
    delete:
      operationId: deleteDavlatovAllocation
      tags: [davlatov]
      summary: Delete a Davlatov allocation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Deleted

  # ─── Goals ───────────────────────────────────────────────────
  /goals:
    get:
      operationId: listGoals
      tags: [goals]
      summary: List all savings goals
      responses:
        "200":
          description: List of goals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SavingsGoal"
    post:
      operationId: createGoal
      tags: [goals]
      summary: Create a new savings goal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SavingsGoalInput"
      responses:
        "201":
          description: Created goal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavingsGoal"

  /goals/{id}:
    put:
      operationId: updateGoal
      tags: [goals]
      summary: Update a savings goal
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SavingsGoalInput"
      responses:
        "200":
          description: Updated goal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavingsGoal"
    delete:
      operationId: deleteGoal
      tags: [goals]
      summary: Delete a savings goal
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Deleted

  # ─── Behavioral finance ──────────────────────────────────────
  /transactions/classify:
    post:
      operationId: classifyTransaction
      tags: [behavioral]
      summary: Classify an expense by emotional trigger without shame
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionClassificationInput"
      responses:
        "201":
          description: Classified expense and constructive guidance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionClassificationResult"

  # ─── Financial resilience and vault ──────────────────────────
  /financial-profile:
    get:
      operationId: getFinancialAutonomyProfile
      tags: [resilience]
      summary: Get money script, risk tolerance, and autonomy score
      responses:
        "200":
          description: Financial autonomy profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinancialAutonomyProfile"
    patch:
      operationId: updateFinancialAutonomyProfile
      tags: [resilience]
      summary: Update money script and risk tolerance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinancialAutonomyProfileUpdate"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinancialAutonomyProfile"

  /vault:
    get:
      operationId: getVaultSummary
      tags: [resilience]
      summary: List document readiness and autonomy warnings
      responses:
        "200":
          description: Redacted vault document list and readiness summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VaultSummary"
    post:
      operationId: createVaultDocument
      tags: [resilience]
      summary: Store a vault document's encrypted payload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VaultDocumentInput"
      responses:
        "201":
          description: Created redacted vault document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VaultDocument"

  /vault/{id}:
    patch:
      operationId: updateVaultDocument
      tags: [resilience]
      summary: Update vault metadata or encrypted payload
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VaultDocumentUpdate"
      responses:
        "200":
          description: Updated redacted vault document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VaultDocument"
    delete:
      operationId: deleteVaultDocument
      tags: [resilience]
      summary: Delete a vault document
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Deleted

  /vault/{id}/verify:
    post:
      operationId: verifyVaultDocument
      tags: [resilience]
      summary: Mark a vault document as verified today
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Verified redacted vault document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VaultDocument"

  # ─── Hypotheses sandbox ──────────────────────────────────────
  /hypotheses:
    get:
      operationId: listBusinessHypotheses
      tags: [hypotheses]
      summary: List business hypotheses
      responses:
        "200":
          description: Hypothesis list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BusinessHypothesis"
    post:
      operationId: createBusinessHypothesis
      tags: [hypotheses]
      summary: Create a business hypothesis
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BusinessHypothesisInput"
      responses:
        "201":
          description: Created hypothesis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessHypothesis"

  /hypotheses/evaluate:
    post:
      operationId: evaluateBusinessHypothesis
      tags: [hypotheses]
      summary: Stress-test a business hypothesis with Graham and Barbell rules
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HypothesisEvaluationInput"
      responses:
        "200":
          description: Updated existing hypothesis evaluation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HypothesisEvaluationResult"
        "201":
          description: Created and evaluated hypothesis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HypothesisEvaluationResult"

  /hypotheses/{id}:
    patch:
      operationId: updateBusinessHypothesis
      tags: [hypotheses]
      summary: Update a business hypothesis
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BusinessHypothesisUpdate"
      responses:
        "200":
          description: Updated hypothesis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessHypothesis"
    delete:
      operationId: deleteBusinessHypothesis
      tags: [hypotheses]
      summary: Delete a business hypothesis
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Deleted

  /hypotheses/{id}/reflection:
    post:
      operationId: reflectOnBusinessHypothesis
      tags: [hypotheses]
      summary: Archive a hypothesis with a Beyoncé Loop reflection
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HypothesisReflectionInput"
      responses:
        "200":
          description: Archived hypothesis with lessons
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessHypothesis"

components:
  schemas:
    TelegramSetupResult:
      type: object
      required: [registered]
      properties:
        registered:
          type: boolean
        url:
          type: string
        pendingUpdateCount:
          type: number

    TelegramWebhookResult:
      type: object
      required: [ok, handled]
      properties:
        ok:
          type: boolean
        handled:
          type: boolean
        reason:
          type: string

    TelegramApiResponse:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
        result:
          type: object
          additionalProperties: true
        description:
          type: string
      additionalProperties: true

    TelegramLinkStatus:
      type: object
      required: [connected]
      properties:
        connected:
          type: boolean

    TelegramLinkToken:
      type: object
      required: [connected, command, deepLink, expiresAt]
      properties:
        connected:
          type: boolean
        command:
          type: string
        deepLink:
          type: string
        expiresAt:
          type: string

    TelegramUpdateInput:
      type: object
      description: Telegram Update payload
      properties:
        update_id:
          type: number
        message:
          type: object
          properties:
            chat:
              type: object
              properties:
                id:
                  type: number
            text:
              type: string

    AuthUser:
      type: object
      required: [id, email, firstName, lastName, profileImageUrl]
      properties:
        id:
          type: string
        email:
          type: [string, "null"]
        firstName:
          type: [string, "null"]
        lastName:
          type: [string, "null"]
        profileImageUrl:
          type: [string, "null"]
    AuthUserEnvelope:
      type: object
      required: [user]
      properties:
        user:
          oneOf:
            - $ref: "#/components/schemas/AuthUser"
            - type: "null"
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    # ─── Debt ────────────────────────────────────────────────
    Debt:
      type: object
      required: [id, creditorName, totalDebt, monthlyPayment, interestRate, dueDate, createdAt]
      properties:
        id:
          type: number
        creditorName:
          type: string
        totalDebt:
          type: number
        monthlyPayment:
          type: number
        interestRate:
          type: number
          description: Annual interest rate as a percentage (e.g. 18.5 for 18.5%)
        dueDate:
          type: string
          description: ISO date string (YYYY-MM-DD)
        notes:
          type: ["string", "null"]
        createdAt:
          type: string

    DebtInput:
      type: object
      required: [creditorName, totalDebt, monthlyPayment, interestRate, dueDate]
      properties:
        creditorName:
          type: string
        totalDebt:
          type: number
        monthlyPayment:
          type: number
        interestRate:
          type: number
        dueDate:
          type: string
        notes:
          type: string

    PayoffEntry:
      type: object
      required: [debtId, creditorName, order, monthsToPayoff, totalInterest, totalPaid]
      properties:
        debtId:
          type: number
        creditorName:
          type: string
        order:
          type: number
        monthsToPayoff:
          type: number
        totalInterest:
          type: number
        totalPaid:
          type: number

    PayoffSchedules:
      type: object
      required: [snowball, avalanche, snowballTotalMonths, avalancheTotalMonths, snowballTotalInterest, avalancheTotalInterest]
      properties:
        snowball:
          type: array
          items:
            $ref: "#/components/schemas/PayoffEntry"
        avalanche:
          type: array
          items:
            $ref: "#/components/schemas/PayoffEntry"
        snowballTotalMonths:
          type: number
        avalancheTotalMonths:
          type: number
        snowballTotalInterest:
          type: number
        avalancheTotalInterest:
          type: number

    # ─── Expense ─────────────────────────────────────────────
    Expense:
      type: object
      required: [id, category, name, amount, isEssential, createdAt]
      properties:
        id:
          type: number
        category:
          type: string
          enum: [housing, food, transport, utilities, health, miscellaneous]
        name:
          type: string
        amount:
          type: number
        isEssential:
          type: boolean
        emotionalTrigger:
          type: ["string", "null"]
          enum: [routine, stress_buying, status_validation, burnout_convenience, null]
        isImpulseBuy:
          type: boolean
        createdAt:
          type: string

    ExpenseInput:
      type: object
      required: [category, name, amount, isEssential]
      properties:
        category:
          type: string
          enum: [housing, food, transport, utilities, health, miscellaneous]
        name:
          type: string
        amount:
          type: number
        isEssential:
          type: boolean
        emotionalTrigger:
          type: string
          enum: [routine, stress_buying, status_validation, burnout_convenience]
        isImpulseBuy:
          type: boolean

    BurnRate:
      type: object
      required: [totalMonthly, essentialTotal, variableTotal, byCategory]
      properties:
        totalMonthly:
          type: number
        essentialTotal:
          type: number
        variableTotal:
          type: number
        byCategory:
          type: array
          items:
            type: object
            required: [category, total, essentialAmount, variableAmount]
            properties:
              category:
                type: string
              total:
                type: number
              essentialAmount:
                type: number
              variableAmount:
                type: number

    # ─── Income ──────────────────────────────────────────────
    Income:
      type: object
      required: [id, source, projectedAmount, confidence, month, createdAt]
      properties:
        id:
          type: number
        source:
          type: string
        projectedAmount:
          type: number
        actualAmount:
          type: ["number", "null"]
        confidence:
          type: string
          enum: [HIGH, MEDIUM, LOW]
        month:
          type: string
          description: Month in YYYY-MM format
        notes:
          type: ["string", "null"]
        createdAt:
          type: string

    IncomeInput:
      type: object
      required: [source, projectedAmount, confidence, month]
      properties:
        source:
          type: string
        projectedAmount:
          type: number
        actualAmount:
          type: number
        confidence:
          type: string
          enum: [HIGH, MEDIUM, LOW]
        month:
          type: string
        notes:
          type: string

    ProjectionSummary:
      type: object
      required: [totalProjected, totalActual, confidenceWeightedProjected, byConfidence, incomeVsExpenseGap]
      properties:
        totalProjected:
          type: number
        totalActual:
          type: number
        confidenceWeightedProjected:
          type: number
        byConfidence:
          type: array
          items:
            type: object
            required: [confidence, projected, actual, count]
            properties:
              confidence:
                type: string
              projected:
                type: number
              actual:
                type: number
              count:
                type: number
        incomeVsExpenseGap:
          type: number
          description: Confidence-weighted income minus total monthly expenses

    # ─── Profile ─────────────────────────────────────────────
    FinancialProfile:
      type: object
      required: [id, currentSavings, crisisMode, createdAt, updatedAt]
      properties:
        id:
          type: number
        currentSavings:
          type: number
        crisisMode:
          type: boolean
        createdAt:
          type: string
        updatedAt:
          type: string

    ProfileUpdate:
      type: object
      properties:
        currentSavings:
          type: number
        crisisMode:
          type: boolean

    # ─── Dashboard ───────────────────────────────────────────
    MonthlyBreakdownEntry:
      type: object
      required: [month, revenue, expenses, reinvestments, dividends, netProfit]
      properties:
        month:
          type: string
        revenue:
          type: number
        expenses:
          type: number
        reinvestments:
          type: number
        dividends:
          type: number
        netProfit:
          type: number

    DashboardSummary:
      type: object
      required: [totalDebt, totalMonthlyDebtPayment, totalMonthlyExpenses, totalMonthlyIncome, currentSavings, netMonthlyCashFlow, financialRunwayMonths, debtCount, crisisMode]
      properties:
        totalDebt:
          type: number
        totalMonthlyDebtPayment:
          type: number
        totalMonthlyExpenses:
          type: number
        totalMonthlyIncome:
          type: number
        currentSavings:
          type: number
        netMonthlyCashFlow:
          type: number
        financialRunwayMonths:
          type: number
          description: Months of runway at current burn rate with current savings
        debtCount:
          type: number
        crisisMode:
          type: boolean
        totalProjectRevenue:
          type: number
        totalProjectNetProfit:
          type: number
        totalProjectDividends:
          type: number
        monthlyBreakdown:
          type: array
          items:
            $ref: "#/components/schemas/MonthlyBreakdownEntry"

    # ─── Crisis ──────────────────────────────────────────────
    CrisisActionStep:
      type: object
      required: [priority, action, monthlySaving, description]
      properties:
        priority:
          type: number
        action:
          type: string
        monthlySaving:
          type: number
        description:
          type: string

    CrisisSimulation:
      type: object
      required: [essentialBurnRate, currentBurnRate, savingsAmount, runwayMonthsFull, runwayMonthsCrisis, monthlyShortfall, actionPlan, eliminableExpenses]
      properties:
        essentialBurnRate:
          type: number
          description: Minimum cost of living (essential expenses + minimum debt payments)
        currentBurnRate:
          type: number
          description: Current total monthly spend
        savingsAmount:
          type: number
        runwayMonthsFull:
          type: number
          description: Months at full current burn rate
        runwayMonthsCrisis:
          type: number
          description: Months surviving at essential-only burn rate
        monthlyShortfall:
          type: number
          description: Monthly income gap that needs to be covered
        actionPlan:
          type: array
          items:
            $ref: "#/components/schemas/CrisisActionStep"
        eliminableExpenses:
          type: array
          items:
            $ref: "#/components/schemas/Expense"

