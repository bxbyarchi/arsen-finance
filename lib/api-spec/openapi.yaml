        conservativePaybackMonths:
          type: ["number", "null"]
        marginOfSafety:
          type: ["number", "null"]
        riskRating:
          type: ["string", "null"]
          enum: [Low, Medium, High, Barbell Violation, null]
        evaluatedAt:
