        title:
          type: string
        status:
          type: string
          enum: [learning_zone, performance_zone, archived]
        projectedBudget:
          type: number
        actualRiskImpact:
          type: number
        expectedMonthlyRevenue:
          type: number
        expectedMonthlyCosts:
          type: number
        keyLessons:
          type: string

    HypothesisReflectionInput:
