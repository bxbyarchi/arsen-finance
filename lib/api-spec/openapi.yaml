    AdvisorChatInput:
      type: object
      required: [message]
      properties:
        message:
          type: string
        history:
          type: array
          items:
            $ref: "#/components/schemas/AdvisorChatHistoryItem"

    AdvisorChatContext:
      type: object
      required: [liquidity, upcomingObligations, debtObligations, activeDebtCount, budgetTotal, safetyReserveTarget, riskBandAvailable, safeToSpendNow, upcomingDebts, marketDataStatus, inflationRateAnnual]
      properties:
        liquidity:
